name: Public edition validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q .
      - name: Verify managed source
        run: python scripts/verify_release.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

  windows-launch:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify managed source
        run: python scripts/verify_release.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Exercise canonical BAT from unrelated working directory
        shell: cmd
        run: |
          cd /d "%TEMP%"
          call "%GITHUB_WORKSPACE%\Kalshi10x1cPublic.bat" "%GITHUB_WORKSPACE%\examples\eligible_snapshot.json" > NUL
