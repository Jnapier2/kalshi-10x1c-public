name: Bug report
about: Report a reproducible non-sensitive problem
body:
  - type: markdown
    attributes:
      value: "Never include API keys, private keys, account IDs, balances, positions, or order history."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
